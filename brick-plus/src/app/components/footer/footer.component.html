<footer class="site-footer">
  <div class="footer-content">
    <section class="footer-brand" aria-label="Brick+ sur les réseaux sociaux">
      <a class="footer-logo">
        <img src="/assets/images/brickplus.png" alt="Brick+" />
      </a>
      <h2>Rejoignez nos réseaux</h2>
      <div class="social-links">
        <a routerLink="/catalogue" aria-label="Facebook">
          <span class="social-mark">f</span>
          <span>Facebook</span>
        </a>
        <a routerLink="/catalogue" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="instagram-dot" cx="17.5" cy="6.7" r="1"></circle>
          </svg>
          <span>Instagram</span>
        </a>
      </div>
    </section>

    <nav class="footer-links" aria-label="Rubriques magasin">
      <h2>Magasins</h2>
      @for (link of storeLinks; track link) {
        <a routerLink="/catalogue">{{ link }}</a>
      }
    </nav>

    <nav class="footer-links help-links" aria-label="Aide et informations">
      <h2>Aides</h2>
      @for (link of helpLinks; track link) {
        <a routerLink="/catalogue">{{ link }}</a>
      }
    </nav>

    <aside class="rating-card" aria-label="Avis clients : note de 5 sur 5">
      <strong>Service le<br />mieux noté</strong>
      <div class="google-word" aria-label="Google">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
      </div>
      <b>5.0</b>
      <div class="rating-stars" aria-hidden="true">★★★★★</div>
      <small>certifié par Trustindex</small>
    </aside>
  </div>
</footer>
