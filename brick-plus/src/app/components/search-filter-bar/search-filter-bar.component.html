<div class="filters-bar">

  <!-- BOUTON SEARCH (FERMÉ) -->
  <button
    *ngIf="!isSearchOpen"
    class="search-toggle"
    (click)="toggleSearch()"
    aria-label="Ouvrir la recherche"
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>
  </button>

  <!-- SEARCH FULL WIDTH (OUVERT) -->
  <div *ngIf="isSearchOpen" class="search-box expanded">

    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>

    <input
      type="text"
      [ngModel]="searchTerm"
      (ngModelChange)="onSearchInput($event)"
      [placeholder]="searchPlaceholder"
      class="search-input"
    />

    <button class="close-btn" (click)="closeSearch()">✕</button>
  </div>

  <!-- SORT + FILTER (masqués si search ouverte) -->
  <ng-container *ngIf="!isSearchOpen">

    <div class="filter-action">
      <select [(ngModel)]="sortBy" (change)="onSortChange()" class="filter-select">
        <option *ngFor="let option of sortOptions; let first = first"
                [value]="option.value"
                [disabled]="first">
          {{ option.label }}
        </option>
      </select>
    </div>

    <div class="filter-action">
      <select [(ngModel)]="filterBy" (change)="onFilterChange()" class="filter-select">
        <option *ngFor="let option of filterOptions; let first = first"
                [value]="option.value"
                [disabled]="first">
          {{ option.label }}
        </option>
      </select>
    </div>

  </ng-container>

</div>
