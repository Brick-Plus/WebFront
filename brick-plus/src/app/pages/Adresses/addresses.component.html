<div class="addresses-page">
  <nav class="breadcrumb">Accueil / Fil d'ariane</nav>
  <h2>Adresse</h2>

  <div class="address-card" (click)="toggleForm('facturation')">
    <span>Adresse de Facturation</span>
    <svg [class.open]="openForm === 'facturation'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 18l6-6-6-6"/>
    </svg>
  </div>

  <div class="address-form" *ngIf="openForm === 'facturation'">
    <h3>Modifiés les informations ?</h3>
    <form (ngSubmit)="onSubmit('facturation')">
      <div class="form-row">
        <input type="text" placeholder="Prénom" [(ngModel)]="facturation.prenom" name="prenom" />
        <input type="text" placeholder="Nom" [(ngModel)]="facturation.nom" name="nom" />
      </div>
      <input type="text" placeholder="Nom de l'entreprise (facultatif)" [(ngModel)]="facturation.entreprise" name="entreprise" />
      <div class="select-row">
        <input type="text" placeholder="Pays/ régions" [(ngModel)]="facturation.pays" name="pays" />
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </div>
      <div class="form-row">
        <input type="text" placeholder="Numéro de voie et nom de la rue" [(ngModel)]="facturation.rue" name="rue" />
        <input type="text" placeholder="Bâtiment, appartement, lot... (facultatif)" [(ngModel)]="facturation.complement" name="complement" />
      </div>
      <div class="form-row">
        <input type="text" placeholder="Code postal" [(ngModel)]="facturation.codePostal" name="codePostal" />
        <input type="text" placeholder="Ville" [(ngModel)]="facturation.ville" name="ville" />
      </div>
      <button type="submit" class="btn-save">Enregistré les modifications</button>
    </form>
  </div>

  <div class="address-card" (click)="toggleForm('livraison')">
    <span>Adresse de Livraison</span>
    <svg [class.open]="openForm === 'livraison'" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 18l6-6-6-6"/>
    </svg>
  </div>

  <div class="address-form" *ngIf="openForm === 'livraison'">
    <h3>Modifiés les informations ?</h3>
    <form (ngSubmit)="onSubmit('livraison')">
      <div class="form-row">
        <input type="text" placeholder="Prénom" [(ngModel)]="livraison.prenom" name="prenom" />
        <input type="text" placeholder="Nom" [(ngModel)]="livraison.nom" name="nom" />
      </div>
      <input type="text" placeholder="Nom de l'entreprise (facultatif)" [(ngModel)]="livraison.entreprise" name="entreprise" />
      <div class="select-row">
        <input type="text" placeholder="Pays/ régions" [(ngModel)]="livraison.pays" name="pays" />
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </div>
      <div class="form-row">
        <input type="text" placeholder="Numéro de voie et nom de la rue" [(ngModel)]="livraison.rue" name="rue" />
        <input type="text" placeholder="Bâtiment, appartement, lot... (facultatif)" [(ngModel)]="livraison.complement" name="complement" />
      </div>
      <div class="form-row">
        <input type="text" placeholder="Code postal" [(ngModel)]="livraison.codePostal" name="codePostal" />
        <input type="text" placeholder="Ville" [(ngModel)]="livraison.ville" name="ville" />
      </div>
      <button type="submit" class="btn-save">Enregistré les modifications</button>
    </form>
  </div>
</div>
